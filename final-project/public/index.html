<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <link rel="manifest" href="manifest.json" />

  <title>Final Project</title>

  <link rel="stylesheet" type="text/css" href="style.css">

  <script src="lib/p5.js"></script>
  <script src="lib/p5.sound.js"></script>
  <script src="socket.io/socket.io.js"></script>  
</head>

<body>
  <button id="requestOrientationButton" onclick="requestOrientation()">Request Orientation</button>


  <!-- Name Entry Overlay -->
  <div id="nameOverlay" class="overlay">
    <div class="nameBox">
      <label for="nameInput">Enter your name:</label>
      <input id="nameInput" type="text" maxlength="12" placeholder="Your name" />
      <button id="nameSubmit">Start</button>
    </div>
  </div>
  
  <div class="main-wrapper">
    <div id="p5-canvas-container"></div>
  </div>

  <button id="avatarSubmit" class="avatar-btn">Submit Avatar</button>
  
  <script src="requestOrientation.js"></script> 
  <script src="script.js"></script>
</body>

</html>
