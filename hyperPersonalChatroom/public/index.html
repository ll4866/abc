<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
 
  
  <link rel="manifest" href="manifest.json" />

  <title>Hyper Personal Chatroom</title>

  <link rel="stylesheet" type="text/css" href="style.css">


  <!-- <script src="lib/p5.js"></script> -->
  <!-- <script src="lib/p5.sound.js"></script> -->
  
  <!-- include socket.io library: -->
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <div class="main-wrapper">
    <header id="chatHeader">
      <h1> 🎞️ Movies to Watch List </h1>
    </header>

    <div id="nameWrapper">
      <input id="nameInput" type="text" placeholder="Enter your name here!" />
      <button id="nameBtn" type="button">Enter</button>
    </div>

    <div id="threadWrapper">
      <ul>
        <li><span class="who">Instruction</span><span class="words">Enter your name first, then chat!</span></li>
        <li><span class="who">Person A</span><span class="words">What movie were we watching tonight?</span></li>
        <li><span class="who">Person B</span><span class="words"><img src="assets/李白.png" alt="Li Bai" style="height:60px; border-radius:4px; vertical-align:middle; margin-left:6px;"> 长安三万里 – let’s ride the poetry!</span></li>
        <li><span class="who">Person A</span><span class="words">Sounds nice. Next week?</span></li>
        <li><span class="who">Person B</span><span class="words">Pick from the pile: 刺杀小说家 | 捕風追影 | The Shadow’s Edge | K-Pop Demon Hunters</span></li>
      </ul>
    </div>
    <div>
        <form id="chatForm">
            <input id="newMessage" placeholder="Type something" autocomplete="off" />
            <button type="submit">Send</button>
        </form>
    </div>

  </div>

  <!-- the script tag below should always be at the bottom, right before the closing body tag -->
  <script src="script.js"></script>
</body>

</html>
